                    <td><textarea class="inline-edit-area" onchange="updateField(${item.id}, 'owner', this.value)" oninput="autoResizeTextarea(this)">${item.owner}</textarea></td>
                    ${dateCellsHtml}
                    ${statusCellHtml}
                    <td class="note-cell" ondragover="attDragOver(event)" ondragleave="attDragLeave(event)" ondrop="attDrop(event, ${item.id})">
                        <div class="rich-view" tabindex="0" data-ph="點擊更新進度...（可 Ctrl+V 貼圖）" title="點一下編輯" onclick="startEdit(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();startEdit(this);}">${fmtLines(item.note)}</div>
                        <textarea class="inline-edit-area" style="display:none;" onchange="updateField(${item.id}, 'note', this.value)" oninput="autoResizeTextarea(this)" onblur="endEdit(this)" onpaste="handleRowPaste(event, ${item.id})" placeholder="點擊更新進度...（可 Ctrl+V 貼圖）">${esc(item.note)}</textarea>
                        <div class="att-area" id="att-${item.id}">${attHtml(item.attachments, pendingUploads[item.id] || 0, a => `removeAttachment(${item.id}, '${a.id}')`)}</div>
                        <label class="att-add-btn">📎 加附件<input type="file" multiple style="display:none" onchange="handleRowFiles(this, ${item.id})"></label>
                    </td>
                    <td>${moveBtnsHtml}<button class="btn-delete" onclick="deleteTask(${item.id})">刪除</button></td>
                `;
            }
            tbody.appendChild(tr);
        });

        document.querySelectorAll('td textarea.inline-edit-area').forEach(textarea => autoResizeTextarea(textarea));
        hydrateAttachments();
    }

    // ====== 待辦時間軸 (橫向 Gantt，依「要求日」倒數) ======
    let ganttCollapsed = { overdue: false, urgent: false, later: true };

    function toggleGanttGroup(key) {
        ganttCollapsed[key] = !ganttCollapsed[key];
        renderTimeline();
    }

    function renderTimeline() {
        const container = document.getElementById('timelineContainer');
        container.innerHTML = '';

        let items = tasks.filter(t =>
            t.type !== 'reminder' &&
            t.status !== 'done' &&
            t.status !== 'archive' &&
            t.reqDate
        );

        if (currentCategoryFilter === 'law') items = items.filter(t => t.category === 'law');
        if (currentCategoryFilter === 'other') items = items.filter(t => t.category !== 'law');

        const legendHtml = `
            <div class="gantt-legend">
                <span><span class="dot" style="background:#c0392b;"></span>已逾期</span>
                <span><span class="dot" style="background:#e74c3c;"></span>3天內到期</span>
                <span><span class="dot" style="background:#27ae60;"></span>尚有餘裕</span>
                <span><span class="dot" style="background:#3498db;"></span>今天</span>
                <span style="margin-left:auto; color:#999; font-size:12px;">💡 點區塊標題可展開/收合</span>
            </div>`;

        if (items.length === 0) {
            container.innerHTML = legendHtml + `<div class="gantt-empty">目前沒有已設定「要求日」的進行中事項</div>`;
            return;
        }

        const today = new Date(); today.setHours(0, 0, 0, 0);

        const overdueItems = [];
        const urgentItems = [];
        const laterItems = [];
        items.forEach(it => {
            const reqD = new Date(it.reqDate); reqD.setHours(0, 0, 0, 0);
            const diffDays = Math.round((reqD - today) / 86400000);
            it._diffDays = diffDays;
            if (diffDays < 0) overdueItems.push(it);
            else if (diffDays <= 3) urgentItems.push(it);
            else laterItems.push(it);
        });
        [overdueItems, urgentItems, laterItems].forEach(arr => arr.sort((a, b) => new Date(a.reqDate) - new Date(b.reqDate)));

        let minDate = new Date(today);
        let maxDate = new Date(today);
        items.forEach(it => {
            const d = new Date(it.reqDate); d.setHours(0, 0, 0, 0);
            if (d < minDate) minDate = new Date(d);
            if (d > maxDate) maxDate = new Date(d);
        });
        minDate.setDate(minDate.getDate() - 1);
        maxDate.setDate(maxDate.getDate() + 2);

        const totalDays = Math.max(1, Math.round((maxDate - minDate) / 86400000));
        const dayWidth = 46;
        const chartWidth = totalDays * dayWidth;
        const labelWidth = 230;
        const todayOffset = Math.round((today - minDate) / 86400000) * dayWidth;

        function buildAxisHtml() {
            let html = `<div style="position:relative; height:34px; margin-left:${labelWidth}px; width:${chartWidth}px; border-bottom:1px solid #ddd;">`;
            for (let i = 0; i <= totalDays; i++) {
                const d = new Date(minDate); d.setDate(d.getDate() + i);
                const isToday = d.getTime() === today.getTime();
                html += `<div class="gantt-axis-cell" style="left:${i * dayWidth}px; width:${dayWidth}px; ${isToday ? 'font-weight:bold;color:#3498db;' : ''}">${d.getMonth() + 1}/${d.getDate()}</div>`;
            }
            html += `</div>`;
            return html;
        }

        function buildRowHtml(it) {
            const diffDays = it._diffDays;
            const reqD = new Date(it.reqDate); reqD.setHours(0, 0, 0, 0);
            const isOverdue = diffDays < 0;

            const barStart = isOverdue ? reqD : today;
            const barEnd = isOverdue ? today : reqD;
            const offsetDays = Math.round((barStart - minDate) / 86400000);
            let spanDays = Math.round((barEnd - barStart) / 86400000);
            if (spanDays < 1) spanDays = 1;

            let barColor = '#27ae60';
            if (diffDays < 0) barColor = '#c0392b';
            else if (diffDays <= 3) barColor = '#e74c3c';

            let barLabel = diffDays < 0 ? `逾期 ${Math.abs(diffDays)} 天` : (diffDays === 0 ? '今天到期' : `剩 ${diffDays} 天`);

            const importanceMark = it.importance === '3' ? '⭐ ' : '';
            const catMark = it.category === 'law' ? '⚖️ ' : '';
            const labelText = `${importanceMark}${catMark}${it.project ? '[' + it.project + '] ' : ''}${it.task}`;
            const safeTitle = labelText.replace(/"/g, '&quot;');

            return `
                <div class="gantt-row">
                    <div class="gantt-row-label" title="${safeTitle}">${labelText}</div>
                    <div style="position:relative; height:100%; width:${chartWidth}px;">
                        <div class="gantt-bar" style="left:${offsetDays * dayWidth}px; width:${spanDays * dayWidth}px; background:${barColor};" title="要求日: ${it.reqDate}">${barLabel}</div>
                    </div>
                </div>`;
        }

        function buildGroupHtml(key, title, color, arr) {
            if (arr.length === 0) return '';
            const collapsed = ganttCollapsed[key];
            const arrow = collapsed ? '▶' : '▼';
            let html = `
                <div class="gantt-group-header" style="background:${color}20; border-left:4px solid ${color};" onclick="toggleGanttGroup('${key}')">
                    <span style="font-weight:bold; color:${color};">${arrow} ${title}</span>
                    <span class="gantt-group-count" style="background:${color};">${arr.length} 件</span>
                </div>`;
            if (!collapsed) {
                html += `<div style="position:relative;">${arr.map(buildRowHtml).join('')}</div>`;
            }
            return html;
        }

        const axisHtml = buildAxisHtml();
        let rowsHtml = `<div style="position:relative;">`;
        rowsHtml += buildGroupHtml('overdue', '已逾期', '#c0392b', overdueItems);
        rowsHtml += buildGroupHtml('urgent', '3天內到期', '#e74c3c', urgentItems);
        rowsHtml += buildGroupHtml('later', '尚有餘裕', '#27ae60', laterItems);

        rowsHtml += `<div class="gantt-today-line" style="left:${labelWidth + todayOffset}px;"></div>`;
        rowsHtml += `<div class="gantt-today-tag" style="left:${labelWidth + todayOffset}px;">今天</div>`;
        rowsHtml += `</div>`;

        container.innerHTML = `
            ${legendHtml}
            <div style="min-width:${labelWidth + chartWidth}px; position:relative;">
                ${axisHtml}
                ${rowsHtml}
            </div>`;
    }

    function addTask() {
        const importance = document.getElementById('taskImportance').value;
        const category = document.getElementById('taskClass').value;
        const type = document.getElementById('taskType').value;
        const project = document.getElementById('project').value;
        const task = document.getElementById('task').value;
        const owner = document.getElementById('owner').value;
        const reqDate = (type === 'reminder') ? '' : document.getElementById('reqDate').value;
        const promiseDate = (type === 'reminder') ? '' : document.getElementById('promiseDate').value;
        const note = document.getElementById('note').value;

        if (!task) { alert('請填寫完整內容！'); return; }
        if (formUploading > 0) { alert('附件還在上傳中，請等上傳完成再新增。'); return; }

        const newTask = {
            id: Date.now(), importance: importance, category: category, type: type, project: project,
            task: task, owner: owner, reqDate: reqDate, promiseDate: promiseDate,
            status: 'todo', note: note, archiveDate: null, today: false,
            attachments: pendingForm.slice()
        };

        tasks.push(newTask);
        pendingForm = [];
        renderFormAtt();
        if (type === 'reminder') { switchFilter('reminder'); } else { render(); }

        document.getElementById('task').value = '';
        document.getElementById('owner').value = '';
        document.getElementById('project').value = '';
        document.getElementById('reqDate').value = '';
        document.getElementById('promiseDate').value = '';
        document.getElementById('note').value = '';
        saveToStorage();
    }

    function updateField(id, field, value) {
        const index = tasks.findIndex(item => item.id === id);
        if (index !== -1) {
            const oldProjectKey = projectKeyOf(tasks[index]);
            tasks[index][field] = value;
            // 換到別的專案：舊專案的順序號碼不適用，清掉後會排在新專案的最後面
            if (field === 'project' && projectKeyOf(tasks[index]) !== oldProjectKey) {
                delete tasks[index].taskOrder;
                delete tasks[index].projectOrder;
            }
            if (field === 'type' && value === 'reminder') {
                tasks[index].reqDate = '';
                tasks[index].promiseDate = '';
            }
            saveToStorage();
        }
    }

    function updateStatus(id, newStatus) {
        const index = tasks.findIndex(item => item.id === id);
        if (index !== -1) {
            const oldStatus = tasks[index].status;
            tasks[index].status = newStatus;

            // 按下「已完成」時自動記錄完成日期；改回其他進度就清掉（結案待歸檔則保留）
            if (newStatus === 'done' && oldStatus !== 'done') {
                tasks[index].doneDate = localDateStr();
            } else if (newStatus !== 'done' && newStatus !== 'archive') {
                delete tasks[index].doneDate;
            }

            if (oldStatus !== 'done' && newStatus === 'done' && tasks[index].type === 'assign') {
                const trackingTask = {
                    id: Date.now() + Math.random(), importance: tasks[index].importance || "2", category: tasks[index].category || "other",
                    type: 'general', project: tasks[index].project || '',
                    task: `【追蹤】確認 ${tasks[index].owner} 執行「${tasks[index].task}」的後續結果與回報`,
                    owner: '我', reqDate: '', promiseDate: '', status: 'todo',            
                    note: `系統提示：此項目因完成工作自動生成。`, archiveDate: null, today: false
                };
                tasks.push(trackingTask);
                alert(`通知：系統已自動為你生成一筆對應的【追蹤事項】。`);
            }
            if (newStatus === 'archive') {
                tasks[index].archiveDate = new Date().toISOString();
                alert('已設定為結案待歸檔。');
            } else { tasks[index].archiveDate = null; }
            saveToStorage();
            render();
        }
    }

    // 手動修改完成日（舊資料沒有日期時，可以在這裡補上；已完成頁會立刻重新排序）
    function updateDoneDate(id, value) {
        const t = tasks.find(item => item.id === id);
        if (!t) return;
        if (value) t.doneDate = value; else delete t.doneDate;
        saveToStorage();
        render();
    }

    function deleteTask(id) {
        const target = tasks.find(item => item.id === id);
        const hasAtt = target && target.attachments && target.attachments.length > 0;
        if (confirm(hasAtt ? '確定要刪除嗎？這筆事項的附件也會一併移到雲端硬碟垃圾桶。' : '確定要刪除嗎？')) {
            trashAttachmentsOf(target);
            tasks = tasks.filter(item => item.id !== id);
            render();
            saveToStorage();
        }
    }
    function deleteArchivedTask(id) {
        const target = archivedTasks.find(item => item.id === id);
        const hasAtt = target && target.attachments && target.attachments.length > 0;
        if (confirm(hasAtt ? '確定要永久刪除嗎？這筆事項的附件也會一併移到雲端硬碟垃圾桶。' : '確定要永久刪除嗎？')) {
            trashAttachmentsOf(target);
            archivedTasks = archivedTasks.filter(item => item.id !== id);
            render();
            saveToStorage();
        }
    }

    window.onload = function() {
        // 手機（窄螢幕）打開時，直接進「手機檢視」
        if (window.innerWidth <= 700) switchFilter('mobile');
        loadFromCloud(function() {
            checkThreeDaysAutoArchive();
            render();
        });
    };
</script>

</body>
</html>
